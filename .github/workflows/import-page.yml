name: import-page
on:
  push:
    paths:
      - '.github/workflows/import-page.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch page
        run: curl -fsSL "https://raw.githubusercontent.com/wbydxx/doumiao-academy/main/xigai/index.html" -o index.html
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: import 习概期中复习知识库"
          git push
